name: Signed stable release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: dbtv-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'dabiao996/dbtv'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate tag, signing key and compatibility contract
        id: release
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: node scripts/release-build.mjs prepare
      - run: npm ci
      - run: npm run lint && npm run build && npm test && npm run test:deploy && node --test server/tests/*integration.mjs
      - run: node scripts/release-build.mjs archive
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: image
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/dabiao996/dbtv:${{ steps.release.outputs.version }}
          build-args: |
            RELEASE_VERSION=${{ steps.release.outputs.version }}
            DATA_CONTRACT=${{ steps.release.outputs.contract }}
      - name: Sign exact image digest and source checksum
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: node scripts/release-build.mjs sign
      - name: Upload verified artifacts, then publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > /tmp/dbtv-release-state.json 2>/dev/null; then
            node -e 'if(!require("/tmp/dbtv-release-state.json").isDraft)process.exit(1)'
          else
            gh release create "$RELEASE_TAG" --draft --title "大彪TV $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-artifacts/dbtv-source.tar.gz release-artifacts/release-manifest.json release-artifacts/release-manifest.sig --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
